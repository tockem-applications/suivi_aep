Listen 80

<VirtualHost _default_:80>
    # Variables DB pour mod_php (PHP 5.3 ne voit pas toujours getenv Docker)
    SetEnv DB_HOST db
    SetEnv DB_NAME suivi_aep_fokoue
    SetEnv DB_USER suivi
    SetEnv DB_PASSWORD suivi

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Order allow,deny
        Allow from all
    </Directory>

    DirectoryIndex index.php index.html
</VirtualHost>
