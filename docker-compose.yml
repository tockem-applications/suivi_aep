# Stack legacy eprouvee (proche WAMP, sans compilation longue)
# Web  : kochanup/apache-2.2-php-5.3  → Apache 2.2 + PHP 5.3.17
# MySQL: vsamov/mysql-5.1.73         → MySQL 5.1.73

services:
  db:
    image: vsamov/mysql-5.1.73
    container_name: suivi_reseau_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-suivi_aep_fokoue}
      MYSQL_USER: ${DB_USER:-suivi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-suivi}
      TZ: ${TZ:-Africa/Douala}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - suivi_reseau_mysql_data:/var/lib/mysql
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: suivi_reseau-web:legacy
    container_name: suivi_reseau_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-suivi_aep_fokoue}
      DB_USER: ${DB_USER:-suivi}
      DB_PASSWORD: ${DB_PASSWORD:-suivi}
      TZ: ${TZ:-Africa/Douala}
    volumes:
      - .:/var/www/html
      - suivi_reseau_backups:/var/www/html/backups

volumes:
  suivi_reseau_mysql_data:
  suivi_reseau_backups:
