# Stack legacy eprouvee (proche WAMP, sans compilation longue)
# Web  : kochanup/apache-2.2-php-5.3  → Apache 2.2 + PHP 5.3.17
# MySQL: vsamov/mysql-5.1.73         → MySQL 5.1.73

services:
  db:
    image: vsamov/mysql-5.1.73
    container_name: suivi_reseau_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-suivi_aep_fokoue}
      MYSQL_USER: ${DB_USER:-suivi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-suivi}
      TZ: ${TZ:-Africa/Douala}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - suivi_reseau_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # L'image vsamov/mysql ne lit pas /docker-entrypoint-initdb.d — import App_vide.sql si besoin
  db-init:
    image: vsamov/mysql-5.1.73
    container_name: suivi_reseau_db_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-suivi_aep_fokoue}
      DB_INIT_HOST: db
    volumes:
      - ./app-setup/App_vide.sql:/schema/App_vide.sql:ro
      - ./docker/mysql-init.sh:/mysql-init.sh:ro
    entrypoint: ["/bin/sh", "-c", "sed 's/\\r$//' /mysql-init.sh | /bin/sh"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: suivi_reseau-web:legacy
    container_name: suivi_reseau_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-suivi_aep_fokoue}
      DB_USER: ${DB_USER:-suivi}
      DB_PASSWORD: ${DB_PASSWORD:-suivi}
      TZ: ${TZ:-Africa/Douala}
      # 1 = contourne la verification .lic si OpenSSL manque (image PHP 5.3 kochanup). WAMP prod : 0
      LICENCE_DEV_MODE: ${LICENCE_DEV_MODE:-1}
    volumes:
      - .:/var/www/html
      - ./backups:/var/www/html/backups
      # VirtualHost par defaut de l'image → htdocs ; on force le code monte dans /var/www/html
      - ./docker/apache/default_80.conf:/opt/apache-2.2/conf/virtual/default_80.conf:ro
      - ./docker/php/docker-dev.ini:/opt/php/lib/php.d/docker-dev.ini:ro

volumes:
  suivi_reseau_mysql_data:
