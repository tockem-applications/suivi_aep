<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<![CDATA[
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; background:#F8FAFC; }
  * { box-sizing:border-box; }
</style>
</helmet>

<div style="position:relative;height:100vh;width:100%;overflow:hidden;color:#0F172A;">
  <!-- Backdrop: dimmed Liste des AEP -->
  <div style="position:absolute;inset:0;filter:blur(1px);opacity:.55;pointer-events:none;">
    <div style="display:flex;height:100%;">
      <div style="width:260px;flex-shrink:0;background:#fff;border-right:1px solid #E2E8F0;"></div>
      <div style="flex:1;padding:32px;">
        <div style="height:32px;width:220px;background:#E2E8F0;border-radius:6px;margin-bottom:20px;"></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">
          <div style="height:150px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;"></div>
          <div style="height:150px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;"></div>
          <div style="height:150px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;"></div>
        </div>
      </div>
    </div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(15,23,42,0.35);"></div>

  <!-- Drawer -->
  <div style="position:absolute;top:0;right:0;height:100%;width:480px;background:#fff;box-shadow:-12px 0 32px rgba(15,23,42,.12);display:flex;flex-direction:column;">
    <div style="padding:20px 24px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:16px;font-weight:800;">Nouvel AEP</div>
      <button style="background:none;border:none;font-size:18px;color:#64748B;cursor:pointer;">✕</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:13px;font-weight:600;color:#334155;">Libellé de l'AEP *</label>
        <input placeholder="Ex. AEP Nkongzem Rural" style="border:1px solid #CBD5E1;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;"/>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;font-weight:600;color:#334155;">Date de création</label>
          <input placeholder="JJ/MM/AAAA" style="border:1px solid #CBD5E1;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;"/>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;font-weight:600;color:#334155;">Mois de base</label>
          <input placeholder="Janvier 2026" style="border:1px solid #CBD5E1;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;"/>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:13px;font-weight:600;color:#334155;">Banque</label>
        <input placeholder="Ex. Afriland First Bank" style="border:1px solid #CBD5E1;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;"/>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:13px;font-weight:600;color:#334155;">N° de compte</label>
        <input placeholder="CM21 xxxx xxxx xxxx" style="border:1px solid #CBD5E1;border-radius:8px;padding:10px 12px;font-size:14px;font-family:'JetBrains Mono',monospace;outline:none;"/>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label style="font-size:13px;font-weight:600;color:#334155;">Modèle de facture</label>
        <div style="display:flex;gap:10px;">
          <label style="flex:1;border:2px solid #0E7490;border-radius:8px;padding:12px;text-align:center;cursor:pointer;background:#ECFEFF;">
            <div style="font-size:13px;font-weight:700;color:#0E7490;">Fokoué</div>
          </label>
          <label style="flex:1;border:1px solid #E2E8F0;border-radius:8px;padding:12px;text-align:center;cursor:pointer;">
            <div style="font-size:13px;font-weight:600;color:#334155;">Nkongzem</div>
          </label>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label style="font-size:13px;font-weight:600;color:#334155;">Type de distribution</label>
        <div style="display:flex;gap:10px;">
          <label style="flex:1;border:2px solid #0E7490;border-radius:8px;padding:12px;text-align:center;cursor:pointer;background:#ECFEFF;">
            <div style="font-size:13px;font-weight:700;color:#0E7490;">RDS</div>
            <div style="font-size:11px;color:#0E7490;">Réseau distribué simple</div>
          </label>
          <label style="flex:1;border:1px solid #E2E8F0;border-radius:8px;padding:12px;text-align:center;cursor:pointer;">
            <div style="font-size:13px;font-weight:600;color:#334155;">RDC</div>
            <div style="font-size:11px;color:#64748B;">Réseau distribué complexe</div>
          </label>
        </div>
      </div>
    </div>
    <div style="padding:16px 24px;border-top:1px solid #E2E8F0;display:flex;justify-content:flex-end;gap:10px;">
      <button style="background:#fff;color:#334155;border:1px solid #E2E8F0;padding:10px 18px;border-radius:8px;font-weight:600;font-size:13px;">Annuler</button>
      <button style="background:#0E7490;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;font-size:13px;">Créer l'AEP</button>
    </div>
  </div>
</div>
]]>
</x-dc>
</body>
</html>
